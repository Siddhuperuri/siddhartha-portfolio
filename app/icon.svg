<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset="0.55" stop-color="#ffab5c"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff4e0"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ff7a1f" stroke-width="4" opacity="0.55" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="14.5" fill="#000" stroke="url(#ring)" stroke-width="3.5"/>
  <ellipse cx="32" cy="32" rx="29" ry="2.6" fill="url(#disc)"/>
</svg>
